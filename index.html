<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OpenCV デジタル水族館 完全版</title>

<!-- p5.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

<!-- OpenCV.js -->
<script src="https://docs.opencv.org/4.5.5/opencv.js"></script>

<style>

body{
    margin:0;
    background:#001f3f;
    color:white;
    font-family:sans-serif;
    text-align:center;
    overflow:hidden;
}

h1{
    margin:10px;
}

#controls{
    margin:10px;
}

video{
    width:320px;
    border-radius:10px;
    border:3px solid white;
    background:black;
}

button{
    padding:12px 20px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#00aaff;
    color:white;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#0088cc;
}

canvas{
    display:block;
    margin:auto;
}

#status{
    margin-top:10px;
    color:#aaddff;
    font-size:14px;
}

</style>
</head>

<body>

<h1>🐟 OpenCV デジタル水族館 🐠</h1>

<div id="controls">

    <video id="video" autoplay playsinline></video>

    <br>

    <button onclick="captureFish()">
        魚を撮影
    </button>

    <div id="status">
        ✅ OpenCV.js 読み込み完了
    </div>

</div>

<script>

let fishes = [];

let video;

// --------------------
// カメラ開始
// --------------------

async function setupCamera(){

    video = document.getElementById("video");

    const stream =
        await navigator.mediaDevices.getUserMedia({

        video:true,
        audio:false

    });

    video.srcObject = stream;
}

setupCamera();

// --------------------
// p5 setup
// --------------------

function setup(){

    let cnv = createCanvas(
        window.innerWidth,
        500
    );

    cnv.parent(document.body);
}

// --------------------
// 描画
// --------------------

function draw(){

    background(0,80,150);

    drawOcean();

    for(let fish of fishes){

        fish.x += fish.speed * fish.direction;

        // 反転
        if(fish.x > width + fish.w){

            fish.direction = -1;
        }

        if(fish.x < -fish.w){

            fish.direction = 1;
        }

        push();

        translate(fish.x, fish.y);

        // 影
        tint(0,50);

        image(
            fish.img,
            -fish.w/2 + 8,
            -fish.h/2 + 8,
            fish.w,
            fish.h
        );

        noTint();

        // 向き
        if(fish.direction == -1){

            scale(-1,1);
        }

        // ゆらぎ
        let swimY =
            sin(frameCount * 0.05 + fish.offset)
            * 5;

        image(
            fish.img,
            -fish.w/2,
            -fish.h/2 + swimY,
            fish.w,
            fish.h
        );

        pop();
    }
}

// --------------------
// 魚撮影
// --------------------

function captureFish(){

    // 一時Canvas
    let tempCanvas =
        document.createElement("canvas");

    tempCanvas.width = 320;
    tempCanvas.height = 240;

    let ctx =
        tempCanvas.getContext("2d");

    ctx.drawImage(video,0,0,320,240);

    // OpenCV画像
    let src = cv.imread(tempCanvas);

    let gray = new cv.Mat();

    let thresh = new cv.Mat();

    // グレースケール
    cv.cvtColor(
        src,
        gray,
        cv.COLOR_RGBA2GRAY
    );

    // ぼかし
    cv.GaussianBlur(
        gray,
        gray,
        new cv.Size(5,5),
        0
    );

    // 2値化
    cv.threshold(
        gray,
        thresh,
        170,
        255,
        cv.THRESH_BINARY_INV
    );

    // ノイズ除去
    let kernel =
        cv.Mat.ones(3,3,cv.CV_8U);

    cv.morphologyEx(
        thresh,
        thresh,
        cv.MORPH_OPEN,
        kernel
    );

    // 輪郭検出
    let contours =
        new cv.MatVector();

    let hierarchy =
        new cv.Mat();

    cv.findContours(
        thresh,
        contours,
        hierarchy,
        cv.RETR_EXTERNAL,
        cv.CHAIN_APPROX_NONE
    );

    // 最大輪郭
    let maxArea = 0;

    let maxIndex = -1;

    for(let i=0;i<contours.size();i++){

        let cnt =
            contours.get(i);

        let area =
            cv.contourArea(cnt);

        if(area > maxArea){

            maxArea = area;

            maxIndex = i;
        }
    }

    // 検出失敗
    if(maxIndex == -1){

        alert("魚を検出できません");

        cleanup(
            src,
            gray,
            thresh,
            contours,
            hierarchy,
            kernel
        );

        return;
    }

    // マスク
    let mask =
        new cv.Mat.zeros(
            src.rows,
            src.cols,
            cv.CV_8UC1
        );

    cv.drawContours(
        mask,
        contours,
        maxIndex,
        new cv.Scalar(255),
        -1
    );

    // 魚抽出
    let result =
        new cv.Mat();

    cv.bitwise_and(
        src,
        src,
        result,
        mask
    );

    // RGBA化
    cv.cvtColor(
        result,
        result,
        cv.COLOR_RGB2RGBA
    );

    // --------------------
    // 白部分透明化
    // --------------------

    for(let y=0; y<mask.rows; y++){

        for(let x=0; x<mask.cols; x++){

            let maskValue =
                mask.ucharPtr(y,x)[0];

            let pixel =
                result.ucharPtr(y,x);

            let r = pixel[0];
            let g = pixel[1];
            let b = pixel[2];

            // 背景透明
            if(maskValue == 0){

                pixel[3] = 0;

            }else{

                // 白っぽい部分透明
                if(
                    r > 220 &&
                    g > 220 &&
                    b > 220
                ){

                    pixel[3] = 0;

                }else{

                    pixel[3] = 255;
                }
            }
        }
    }

    // 最大輪郭
    let cnt =
        contours.get(maxIndex);

    // BOX
    let rect =
        cv.boundingRect(cnt);

    // ROI
    let roi =
        result.roi(rect);

    // 出力Canvas
    let outCanvas =
        document.createElement("canvas");

    cv.imshow(outCanvas, roi);

    // PNG URL
    let imageURL =
        outCanvas.toDataURL("image/png");

    // p5 loadImage
    loadImage(

        imageURL,

        function(fishImg){

            fishes.push({

                img:fishImg,

                x:random(width),

                y:random(100,450),

                speed:random(1,3),

                direction:random([1,-1]),

                offset:random(1000),

                w:rect.width * 0.7,

                h:rect.height * 0.7
            });
        }
    );

    // メモリ解放
    cleanup(
        src,
        gray,
        thresh,
        contours,
        hierarchy,
        kernel,
        mask,
        result,
        roi
    );
}

// --------------------
// 海背景
// --------------------

function drawOcean(){

    // グラデーション
    for(let y=0;y<height;y+=5){

        stroke(
            0,
            80 + y*0.2,
            150 + y*0.1
        );

        line(0,y,width,y);
    }

    // 泡
    noStroke();

    for(let i=0;i<30;i++){

        fill(255,255,255,100);

        circle(

            (frameCount*i*0.6)%width,

            height -
            (frameCount*i*0.8)%height,

            random(5,15)
        );
    }

    // 海藻
    stroke(0,200,100);

    strokeWeight(3);

    noFill();

    for(let x=0;x<width;x+=80){

        beginShape();

        for(let y=height;y>height-120;y-=10){

            let offset =
                sin(
                    frameCount*0.03 +
                    x*0.01 +
                    y*0.05
                ) * 10;

            vertex(x + offset,y);
        }

        endShape();
    }
}

// --------------------
// メモリ解放
// --------------------

function cleanup(){

    for(let i=0;i<arguments.length;i++){

        if(arguments[i]){

            arguments[i].delete();
        }
    }
}

// --------------------
// リサイズ
// --------------------

function windowResized(){

    resizeCanvas(
        window.innerWidth,
        500
    );
}

</script>

</body>
</html>
