<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OpenCV.js デジタル水族館</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>
body{
    margin:0;
    background:#001f3f;
    color:white;
    font-family:sans-serif;
    text-align:center;
    overflow:hidden;
}

h1{
    margin:10px;
}

#controls{
    margin:10px;
}

video{
    width:320px;
    border-radius:10px;
    border:3px solid white;
    background:black;
}

button{
    padding:12px 20px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#00aaff;
    color:white;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#0088cc;
}

canvas{
    display:block;
    margin:auto;
}

#status{
    margin:10px;
    font-size:14px;
    color:#aaddff;
}
</style>
</head>

<body>

<h1>🐟 OpenCV デジタル水族館 🐠</h1>

<div id="controls">
    <video id="video" autoplay playsinline></video>
    <br>
    <button onclick="captureFish()">魚を撮影</button>
    <div id="status">OpenCV.js 読み込み中...</div>
</div>

<script>

let fishes = [];
let video;
let cvReady = false;

async function setupCamera(){

    video = document.getElementById("video");

    const stream = await navigator.mediaDevices.getUserMedia({
        video:true,
        audio:false
    });

    video.srcObject = stream;
}

setupCamera();

cv['onRuntimeInitialized'] = () => {
    cvReady = true;
    document.getElementById("status").innerHTML =
        "✅ OpenCV.js 読み込み完了";
};

function setup(){

    let cnv = createCanvas(window.innerWidth, 500);
    cnv.parent(document.body);
}

function draw(){

    background(0,80,150);

    drawBackground();

    for(let fish of fishes){

        fish.x += fish.speed * fish.direction;

        if(fish.x > width + fish.w){
            fish.direction = -1;
        }

        if(fish.x < -fish.w){
            fish.direction = 1;
        }

        push();

        translate(fish.x, fish.y);

        if(fish.direction == -1){
            scale(-1,1);
        }

        image(
            fish.img,
            -fish.w/2,
            -fish.h/2,
            fish.w,
            fish.h
        );

        pop();
    }
}

function captureFish(){

    if(!cvReady){
        alert("OpenCV.js 読み込み中です");
        return;
    }

    // 一時Canvas
    let tempCanvas = document.createElement("canvas");
    tempCanvas.width = 320;
    tempCanvas.height = 240;

    let ctx = tempCanvas.getContext("2d");

    ctx.drawImage(video,0,0,320,240);

    // OpenCV読み込み
    let src = cv.imread(tempCanvas);

    let gray = new cv.Mat();
    let thresh = new cv.Mat();

    // グレースケール
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

    // ぼかし
    cv.GaussianBlur(
        gray,
        gray,
        new cv.Size(5,5),
        0
    );

    // 2値化
    cv.threshold(
        gray,
        thresh,
        200,
        255,
        cv.THRESH_BINARY_INV
    );

    // 輪郭検出
    let contours = new cv.MatVector();
    let hierarchy = new cv.Mat();

    cv.findContours(
        thresh,
        contours,
        hierarchy,
        cv.RETR_EXTERNAL,
        cv.CHAIN_APPROX_SIMPLE
    );

    // 最大輪郭を探す
    let maxArea = 0;
    let maxContourIndex = -1;

    for(let i=0; i<contours.size(); i++){

        let cnt = contours.get(i);
        let area = cv.contourArea(cnt);

        if(area > maxArea){

            maxArea = area;
            maxContourIndex = i;
        }
    }

    if(maxContourIndex == -1){

        alert("魚を検出できませんでした");

        src.delete();
        gray.delete();
        thresh.delete();
        contours.delete();
        hierarchy.delete();

        return;
    }

    // マスク作成
    let mask = new cv.Mat.zeros(
        src.rows,
        src.cols,
        cv.CV_8UC1
    );

    cv.drawContours(
        mask,
        contours,
        maxContourIndex,
        new cv.Scalar(255),
        -1
    );

    // 結果画像
    let result = new cv.Mat();

    cv.bitwise_and(src, src, result, mask);

    // バウンディングボックス
    let cnt = contours.get(maxContourIndex);
    let rect = cv.boundingRect(cnt);

    // 切り抜き
    let roi = result.roi(rect);

    // 表示用Canvas
    let outCanvas = document.createElement("canvas");

    cv.imshow(outCanvas, roi);

    // p5画像化
    let fishImg = createImg(
        outCanvas.toDataURL(),
        "fish"
    );

    fishImg.hide();

    fishes.push({

        img:fishImg,

        x:random(width),
        y:random(100,450),

        speed:random(1,3),

        direction:random([1,-1]),

        w:rect.width * 0.7,
        h:rect.height * 0.7
    });

    // メモリ解放
    src.delete();
    gray.delete();
    thresh.delete();
    contours.delete();
    hierarchy.delete();
    mask.delete();
    result.delete();
    roi.delete();
}

function drawBackground(){

    // 泡
    noStroke();

    for(let i=0;i<30;i++){

        fill(255,255,255,100);

        circle(
            (frameCount*i*0.5)%width,
            height - (frameCount*i*0.8)%height,
            random(5,15)
        );
    }

    // 海藻
    stroke(0,200,100);

    for(let x=0;x<width;x+=80){

        noFill();

        beginShape();

        for(let y=height;y>height-120;y-=10){

            let offset =
                sin(frameCount*0.03 + x*0.01 + y*0.05)
                * 10;

            vertex(x + offset,y);
        }

        endShape();
    }
}

function windowResized(){

    resizeCanvas(window.innerWidth,500);
}

</script>

</body>
</html>
